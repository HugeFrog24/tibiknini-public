services:
    db:
        image: postgres
        environment:
            POSTGRES_DB_FILE: /run/secrets/postgres_db
            POSTGRES_USER: /run/secrets/postgres_user
            POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
        secrets:
            - postgres_db
            - postgres_user
            - postgres_password
        volumes:
            - dbdata16:/var/lib/postgresql/data # Ensure data persistence across container restarts

    nginx:
        build:
            context: .
            dockerfile: ./nginx/Dockerfile
            args:
                ENVIRONMENT: ${ENV:-prod}
        develop:
            watch: # for hot reload during development
                - action: rebuild
                  path: ./frontend
        volumes:
            - ${MEDIA_PATH}:/var/www/media
            - ./backend/staticfiles:/var/www/staticfiles
        ports:
            - "80:80"
            - "443:443"
        depends_on:
            - django
        restart: always

    django:
        build: ./backend
        command: gunicorn backend.wsgi:application --workers 3 --bind 0.0.0.0:8000
        depends_on:
            - db
        env_file:
            - ./backend/.env # common settings
            - ./backend/.env.${ENV:-prod} # environment-specific settings
        ports:
            - "8000:8000"
        restart: always
        volumes:
            - ./backend:/usr/src/app
            - dbdata16:/var/lib/postgresql/data
            - ${MEDIA_PATH}:/usr/src/app/media
        secrets:
            - postgres_db
            - postgres_user
            - postgres_password
            - email_host
            - email_port
            - email_host_user
            - email_host_password

secrets:
    postgres_db:
        file: ./secrets/postgres_db.txt
    postgres_user:
        file: ./secrets/postgres_user.txt
    postgres_password:
        file: ./secrets/postgres_password.txt
    email_host:
        file: ./secrets/email_host.txt
    email_port:
        file: ./secrets/email_port.txt
    email_host_user:
        file: ./secrets/email_host_user.txt
    email_host_password:
        file: ./secrets/email_host_password.txt

volumes:
    dbdata16:
        name: tibiknini-dbdata16
