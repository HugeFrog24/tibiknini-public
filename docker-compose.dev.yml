version: '3.8'

services:
  django:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    environment:
      DEBUG: "True"
      DOMAIN_NAME: localhost
      MEDIA_PATH: ./media
      DJANGO_SETTINGS_MODULE: "backend.settings"
    volumes:
      - ./backend:/usr/src/app
    command: daphne -b 0.0.0.0 -p 8000 backend.asgi:application
    networks:
      - app_network

  celery_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    volumes:
      - ./backend:/usr/src/app
    environment:
      DEBUG: "True"
      DJANGO_SETTINGS_MODULE: "backend.settings"
    command: celery -A backend worker -l info
    user: celery
    networks:
      - app_network

  celery_beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    volumes:
      - ./backend:/usr/src/app
    environment:
      DEBUG: "True"
      DJANGO_SETTINGS_MODULE: "backend.settings"
    command: celery -A backend beat -l info
    user: celery
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - app_network

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        ENVIRONMENT: dev
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/var/www/html
      - ./media:/var/www/media
    depends_on:
      - django
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  static_volume: